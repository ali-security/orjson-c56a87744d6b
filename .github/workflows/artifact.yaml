name: artifact
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest -k filter"
        required: false
        default: ""
env:
  RUST_TOOLCHAIN: "nightly-2024-07-02"
  CARGO_UNSTABLE_SPARSE_REGISTRY: "true"
  UNSAFE_PYO3_SKIP_VERSION_CHECK: "1"
jobs:

  sdist:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
    env:
      RUST_TOOLCHAIN: "1.72" # MSRV
    steps:
    - name: rustup stable
      run: |
        curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain "${RUST_TOOLCHAIN}" -y
        rustup default "${RUST_TOOLCHAIN}"

    - uses: actions/checkout@v4

    - run: python3 -m pip install --user --upgrade --index-url 'https://:2024-07-02@time-machines-pypi.sealsecurity.io/' pip "maturin==1.6.0" wheel

    - name: Vendor dependencies
      run: |
        maturin build
        cargo fetch
        mkdir .cargo
        cp ci/sdist.toml .cargo/config.toml
        cargo vendor include/cargo --versioned-dirs

    - run: maturin sdist --out=dist

    - run: python3 -m pip install --user --index-url 'https://:2024-07-02@time-machines-pypi.sealsecurity.io/' dist/orjson*.tar.gz
      env:
        CARGO_NET_OFFLINE: "true"

    - run: python3 -m pip install --user --index-url 'https://:2024-07-02@time-machines-pypi.sealsecurity.io/' -r test/requirements.txt -r integration/requirements.txt mypy

    - run: pytest -s -rxX -v -n 2 test ${{ inputs.test-filter && format('-k ''{0}''', inputs.test-filter) || '' }}
      env:
        PYTHONMALLOC: "debug"

    - run: ./integration/run thread
    - run: ./integration/run http
    - run: ./integration/run init
    - run: ./integration/run typestubs

    - name: Store sdist
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_sdist
        path: dist
        overwrite: true
        retention-days: 1

  manylinux_2_17_amd64:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.12' },
          { version: '3.11' },
          { version: '3.10' },
          { version: '3.9' },
          { version: '3.8' },
        ]
    env:
      CC: "clang"
      CFLAGS: "-Os -fstrict-aliasing -fno-plt -flto=full -emit-llvm"
      LDFLAGS: "-fuse-ld=lld -Wl,-plugin-opt=also-emit-llvm -Wl,--as-needed -Wl,-zrelro,-znow"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld -C linker-plugin-lto -C lto=fat -C link-arg=-Wl,-zrelro,-znow -Z mir-opt-level=4 -Z virtual-function-elimination -Z threads=2 -D warnings"
      PATH: "/github/home/.local/bin:/github/home/.cargo/bin:/root/.cargo/bin:/root/.local/bin:/root/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    container:
      image: fedora:41
    steps:

    - name: cpuinfo
      run: cat /proc/cpuinfo

    - name: Build environment pre-clone
      run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$HOME/.cargo/bin:/github/home/.cargo/bin:/root/.cargo/bin:$PATH"
        dnf install -y rustup clang lld git
        # python3.8 was retired from Fedora 41; uv provisions it when the distro package is absent
        dnf install -y python${{ matrix.python.version }} || echo "python${{ matrix.python.version }} is not packaged for fedora:41, uv will provision it"
        rustup-init --default-toolchain "${RUST_TOOLCHAIN}-x86_64-unknown-linux-gnu" --profile minimal --component rust-src -y

    - uses: actions/checkout@v4

    - name: Build environment post-clone
      run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$HOME/.cargo/bin:/github/home/.cargo/bin:/root/.cargo/bin:$PATH"
        if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi

        cargo fetch --target=x86_64-unknown-linux-gnu &

        mkdir .cargo
        cp ci/config.toml .cargo/config.toml

        # pin sysroot compiler_builtins to =0.1.105 (period-correct for nightly-2024-07-02, satisfies std's own floor): a caret drifts to >=0.1.160 which needs edition2024, and per-crate exact pins conflict on the compiler-rt links key
        # drift to a newer version that needs edition2024 (unparseable by this nightly)
        SYSROOT=$(rustc --print sysroot); find "$SYSROOT" -name Cargo.toml -exec grep -l compiler_builtins {} \; | while read f; do sed -i -E 's/(compiler_builtins[^"]*version = )"[0-9][0-9.]*"/\1"=0.1.105"/; s/(compiler_builtins = )"[0-9][0-9.]*"/\1"=0.1.105"/' "$f"; done

        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$PATH"
        uv venv --python python${{ matrix.python.version }}
        uv pip install --upgrade --index-url 'https://:2024-07-02@time-machines-pypi.sealsecurity.io/' "maturin==1.6.0" -r test/requirements.txt -r integration/requirements.txt

    - name: maturin
      run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$HOME/.cargo/bin:/github/home/.cargo/bin:/root/.cargo/bin:$PATH"
        if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
        source "$GITHUB_WORKSPACE/.venv/bin/activate"
        maturin build --release --strip \
          --features=avx512,no-panic,unstable-simd,yyjson \
          --compatibility manylinux_2_17 \
          --interpreter python${{ matrix.python.version }} \
          --target=x86_64-unknown-linux-gnu
        uv pip install target/wheels/orjson*.whl

    - run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$HOME/.cargo/bin:/github/home/.cargo/bin:/root/.cargo/bin:$PATH"
        source "$GITHUB_WORKSPACE/.venv/bin/activate"
        pytest -s -rxX -v -n 2 test ${{ inputs.test-filter && format('-k ''{0}''', inputs.test-filter) || '' }}
      env:
        PYTHONMALLOC: "debug"

    - run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$PATH"
        source "$GITHUB_WORKSPACE/.venv/bin/activate"
        ./integration/run thread
    - run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$PATH"
        source "$GITHUB_WORKSPACE/.venv/bin/activate"
        ./integration/run http
    - run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$PATH"
        source "$GITHUB_WORKSPACE/.venv/bin/activate"
        ./integration/run init

    - run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$PATH"
        source "$GITHUB_WORKSPACE/.venv/bin/activate"
        uv pip install -U --pre --index-url 'https://:2024-07-02@time-machines-pypi.sealsecurity.io/' "numpy>=2.0.0rc1"
        pytest -s test/test_numpy.py
      if: matrix.python.version != '3.8'

    - name: Store wheels
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_manylinux_2_17_amd64_${{ matrix.python.version }}
        path: target/wheels
        overwrite: true
        retention-days: 1

  musllinux_1_2:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # maturin-action fetches the maturin v1.6.0 release tarball from GitHub inside each
      # leg's container. With all 10 legs curling the same asset within the same second,
      # GitHub answered two of them with a ~157 KB HTML error page instead of the 9.8 MB
      # tar.gz and the install died on "gzip: stdin: not in gzip format" before cargo ever
      # ran. Fetch the asset a few legs at a time. Scheduling only - no build input changes,
      # so every wheel stays byte-identical.
      max-parallel: 5
      matrix:
        python: [
          { version: '3.12' },
          { version: '3.11' },
          { version: '3.10' },
          { version: '3.9' },
          { version: '3.8' },
        ]
        platform:
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            platform: linux/arm64
            features: no-panic,unstable-simd,unwind,yyjson
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            platform: linux/amd64
            features: avx512,no-panic,unstable-simd,unwind,yyjson
    steps:
    - uses: actions/checkout@v4

    - name: build-std
      run: |
        mkdir .cargo
        cp ci/config.toml .cargo/config.toml

    - name: Build
      uses: PyO3/maturin-action@v1
      env:
        CC: "gcc"
        CFLAGS: "-Os"
        LDFLAGS: "-Wl,--as-needed"
        RUSTFLAGS: "-C lto=fat -Z mir-opt-level=4 -Z virtual-function-elimination -Z threads=2 -D warnings -C target-feature=-crt-static"
      with:
        maturin-version: v1.6.0
        rust-toolchain: nightly-2024-07-02
        rustup-components: rust-src
        target: ${{ matrix.platform.target }}
        manylinux: musllinux_1_2
        before-script-linux: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          # pin sysroot compiler_builtins to =0.1.105 (period-correct for nightly-2024-07-02, satisfies std's own floor): a caret drifts to >=0.1.160 which needs edition2024, and per-crate exact pins conflict on the compiler-rt links key
          # drift to a newer version that needs edition2024 (unparseable by this nightly)
          SYSROOT=$(rustc --print sysroot); find "$SYSROOT" -name Cargo.toml -exec grep -l compiler_builtins {} \; | while read f; do sed -i -E 's/(compiler_builtins[^"]*version = )"[0-9][0-9.]*"/\1"=0.1.105"/; s/(compiler_builtins = )"[0-9][0-9.]*"/\1"=0.1.105"/' "$f"; done
        args: --release --strip --out=dist --features=${{ matrix.platform.features }} -i python${{ matrix.python.version }}

    - name: QEMU
      if: matrix.platform.arch != 'x86_64'
      uses: docker/setup-qemu-action@v3
      with:
        image: tonistiigi/binfmt:qemu-v8.1.5
        platforms: ${{ matrix.platform.platform }}

    - name: Test
      uses: addnab/docker-run-action@v3
      with:
        image: quay.io/pypa/musllinux_1_2_${{ matrix.platform.arch }}:2024-07-02-9ac04ee
        options: -v ${{ github.workspace }}:/io -w /io
        run: |
          apk add tzdata
          sed -i '/^psutil/d' test/requirements.txt # missing 3.11, 3.12 wheels
          sed -i '/^numpy/d' test/requirements.txt

          python${{ matrix.python.version }} -m venv venv
          venv/bin/pip install -U pip wheel
          venv/bin/pip install -r test/requirements.txt
          venv/bin/pip install orjson --no-index --find-links dist/ --force-reinstall
          venv/bin/python -m pytest -s -rxX -v test

    - name: Store wheels
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_musllinux_1_2_${{ matrix.platform.arch }}_${{ matrix.python.version }}
        path: dist
        overwrite: true
        retention-days: 1

  manylinux_2_17_non_amd64:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.12', abi: 'cp312-cp312' },
          { version: '3.11', abi: 'cp311-cp311' },
          { version: '3.10', abi: 'cp310-cp310' },
          { version: '3.9', abi: 'cp39-cp39' },
          { version: '3.8', abi: 'cp38-cp38' },
        ]
        target: [
          {
            arch: 'aarch64',
            cflags: '-Os -flto=full -fstrict-aliasing',
            features: 'no-panic,unstable-simd,yyjson',
            rustflags: '-Z mir-opt-level=4 -C lto=fat -D warnings',
            target: 'aarch64-unknown-linux-gnu',
            cp38_image: 'ghcr.io/rust-cross/manylinux2014-cross@sha256:f66121856794a303c90c52974227d9fe074f4e9bb52575968e70385c84556031',
          },
          {
            arch: 'armv7',
            cflags: '-Os -flto=full -fstrict-aliasing',
            features: 'no-panic,yyjson', # no SIMD
            rustflags: '-Z mir-opt-level=4 -C lto=fat -D warnings -C opt-level=s',
            target: 'armv7-unknown-linux-gnueabihf',
            cp38_image: 'ghcr.io/rust-cross/manylinux2014-cross@sha256:12b7f1da1e8e04a38848659f3c3a2b2c77861c92af31c1bbfa483bd132895d64',
          },
          {
            arch: 'ppc64le',
            cflags: '-Os -flto=full -fstrict-aliasing',
            features: 'no-panic,unstable-simd,yyjson',
            rustflags: '-Z mir-opt-level=4 -C lto=fat -D warnings',
            target: 'powerpc64le-unknown-linux-gnu',
            cp38_image: 'ghcr.io/rust-cross/manylinux2014-cross@sha256:f6b3a58616a0a8c0a4f3f33d7738bbb0c72dd33ba4cf83503d6d04278da1a52a',
          },
          {
            arch: 's390x',
            cflags: '-Os -flto=full -fstrict-aliasing -march=z10',
            features: 'no-panic,yyjson',
            rustflags: '-Z mir-opt-level=4 -C lto=fat -D warnings -C target-cpu=z10',
            target: 's390x-unknown-linux-gnu',
            cp38_image: 'ghcr.io/rust-cross/manylinux2014-cross@sha256:9444e66aeb8230799c12e895b381e1f664576df7a41b686cbf1a01fa13bf7cb0',
          },
        ]
    steps:
    - uses: actions/checkout@v4
    - name: build-std
      run: |
        mkdir .cargo
        cp ci/config.toml .cargo/config.toml

    - name: Build
      uses: PyO3/maturin-action@v1
      env:
        PYO3_CROSS_LIB_DIR: "/opt/python/${{ matrix.python.abi }}"
        CFLAGS: "${{ matrix.target.cflags }}"
        LDFLAGS: "-Wl,--as-needed"
        RUSTFLAGS: "${{ matrix.target.rustflags }}"
      with:
        maturin-version: v1.6.0
        target: ${{ matrix.target.target }}
        rust-toolchain: nightly-2024-07-02
        rustup-components: rust-src
        manylinux: auto
        container: ${{ matrix.python.version == '3.8' && matrix.target.cp38_image || '' }}
        before-script-linux: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          # pin sysroot compiler_builtins to =0.1.105 (period-correct for nightly-2024-07-02, satisfies std's own floor): a caret drifts to >=0.1.160 which needs edition2024, and per-crate exact pins conflict on the compiler-rt links key
          # drift to a newer version that needs edition2024 (unparseable by this nightly)
          SYSROOT=$(rustc --print sysroot); find "$SYSROOT" -name Cargo.toml -exec grep -l compiler_builtins {} \; | while read f; do sed -i -E 's/(compiler_builtins[^"]*version = )"[0-9][0-9.]*"/\1"=0.1.105"/; s/(compiler_builtins = )"[0-9][0-9.]*"/\1"=0.1.105"/' "$f"; done
        args: --release --strip --out=dist --features=${{ matrix.target.features }} -i python${{ matrix.python.version }}

    - uses: uraimo/run-on-arch-action@v2
      name: Test
      with:
        arch: ${{ matrix.target.arch }}
        distro: ubuntu22.04
        githubToken: ${{ github.token }}
        # ppc64le under qemu-user randomly SIGSEGVs the emulated CPython the moment it
        # spawns a child interpreter, at a different point every run: cp312 lost a
        # pytest-xdist worker ("EOFError: expected 1 bytes, got 0"), cp39 segfaulted inside
        # `venv/bin/pip install`, then cp39 segfaulted in `python3.9 -m venv venv` 0.34 s
        # after container start. No single test is implicated. Docker's default seccomp
        # profile is what filters the clone/memory syscalls qemu needs to emulate those
        # spawns, so drop it for ppc64le only. This is the test step - the wheel is already
        # built and uploaded by the Build step above, so it cannot change artifact bytes.
        dockerRunArgs: ${{ matrix.target.arch == 'ppc64le' && '--security-opt seccomp=unconfined' || '' }}
        install: |
          export TZ=UTC
          export DEBIAN_FRONTEND=noninteractive
          # ports.ubuntu.com serves half-synced indexes ("File has unexpected size ...
          # Mirror sync in progress?"), which fails apt with exit 100 on a random
          # emulated leg each run; retry the fetch, keeping the last attempt fatal
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; sleep 20; done; "$@"; }
          retry apt-get update
          retry apt-get install -y --no-install-recommends --fix-missing software-properties-common gpg gpg-agent curl
          add-apt-repository ppa:deadsnakes/ppa
          retry apt-get update
          retry apt-get install -y --fix-missing python${{ matrix.python.version }}-dev python${{ matrix.python.version }}-venv gcc python3-dev libc6-dev
        run: |
          # qemu-user intermittently SIGSEGVs the emulated interpreter while it forks
          # ensurepip or a pip subprocess (cp312 lost `pip install -r
          # test/requirements.txt` this way); recreate the venv and re-drive the installs
          # rather than lose the leg to an emulation race. Only environment setup is
          # retried - pytest runs exactly once, so a genuine test failure still fails
          # the leg.
          retry() { for i in 1 2 3; do "$@" && return 0; sleep 10; done; "$@"; }
          retry python${{ matrix.python.version }} -m venv --clear venv
          retry venv/bin/pip install -U pip wheel
          retry venv/bin/pip install --index-url 'https://:2024-07-02@time-machines-pypi.sealsecurity.io/' -r test/requirements.txt
          retry venv/bin/pip install orjson --no-index --find-links dist/ --force-reinstall
          venv/bin/python -m pytest -s -rxX -v test

    - name: Store wheels
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_manylinux_2_17_${{ matrix.target.arch }}_${{ matrix.python.version }}
        path: dist
        overwrite: true
        retention-days: 1

  macos_universal2_aarch64:
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.12', macosx_target: "10.15" },
          { version: '3.11', macosx_target: "10.15" },
          { version: '3.10', macosx_target: "10.15" },
        ]
    env:
      CC: "clang"
      CFLAGS: "-Os -fstrict-aliasing -flto=full"
      LDFLAGS: "" # Apple ld rejects -Wl,--as-needed
      CFLAGS_x86_64_apple_darwin: "-O2 -fstrict-aliasing -flto=full -march=x86-64-v2 -mtune=generic"
      CFLAGS_aarch64_apple_darwin: "-O2 -fstrict-aliasing -flto=full -mcpu=apple-m1 -mtune=generic"
      RUSTFLAGS: "-C lto=fat -Z mir-opt-level=4 -Z virtual-function-elimination -Z threads=3 -D warnings"
      PATH: "${{ github.workspace }}/.venv/bin:/Users/runner/.local/bin:/Users/runner/.cargo/bin:/usr/local/opt/curl/bin:/usr/local/bin:/usr/local/sbin:/Users/runner/bin:/Library/Frameworks/Python.framework/Versions/Current/bin:/usr/bin:/bin:/usr/sbin:/sbin"
    steps:

    - uses: actions/checkout@v4

    - uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: "${{ matrix.python.version }}"
        cache-build: true
        allow-build: allow

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "nightly-2024-07-02"
        targets: "aarch64-apple-darwin, x86_64-apple-darwin"
        components: "rust-src"

    - name: Build environment
      run: |
        export PATH="/Users/runner/.local/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

        cargo fetch --target aarch64-apple-darwin &

        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="/Users/runner/.local/bin:$HOME/.local/bin:$PATH"
        uv venv --python python${{ matrix.python.version }}
        uv pip install --upgrade --index-url 'https://:2024-07-02@time-machines-pypi.sealsecurity.io/' "maturin==1.6.0" -r test/requirements.txt -r integration/requirements.txt

        mkdir .cargo
        cp ci/config.toml .cargo/config.toml

        # pin sysroot compiler_builtins to =0.1.105 (period-correct for nightly-2024-07-02, satisfies std's own floor): a caret drifts to >=0.1.160 which needs edition2024, and per-crate exact pins conflict on the compiler-rt links key
        # drift to a newer version that needs edition2024 (unparseable by this nightly)
        SYSROOT=$(rustc --print sysroot); find "$SYSROOT" -name Cargo.toml -exec grep -l compiler_builtins {} \; | while read f; do sed -i '' -E 's/(compiler_builtins[^"]*version = )"[0-9][0-9.]*"/\1"=0.1.105"/; s/(compiler_builtins = )"[0-9][0-9.]*"/\1"=0.1.105"/' "$f"; done

    - name: maturin
      run: |
        PATH=$HOME/.cargo/bin:$PATH \
        MACOSX_DEPLOYMENT_TARGET="${{ matrix.python.macosx_target }}" \
        PYO3_CROSS_LIB_DIR=$(python -c "import sysconfig;print(sysconfig.get_config_var('LIBDIR'))") \
        maturin build --release --strip \
          --features=no-panic,unstable-simd,yyjson \
          --interpreter python${{ matrix.python.version }} \
          --target=universal2-apple-darwin
        uv pip install target/wheels/orjson*.whl

    - run: pytest -s -rxX -v -n 3 test ${{ inputs.test-filter && format('-k ''{0}''', inputs.test-filter) || '' }}
      env:
        PYTHONMALLOC: "debug"

    - run: source .venv/bin/activate && ./integration/run thread
    - run: source .venv/bin/activate && ./integration/run http
    - run: source .venv/bin/activate && ./integration/run init

    - name: Store wheels
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_universal2_aarch64_${{ matrix.python.version }}
        path: target/wheels
        overwrite: true
        retention-days: 1

  macos_universal2_amd64:
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.9', macosx_target: "10.15" },
          { version: '3.8', macosx_target: "10.15" },
        ]
    env:
      CC: "clang"
      CFLAGS: "-Os -fstrict-aliasing -flto=full"
      LDFLAGS: "" # Apple ld rejects -Wl,--as-needed
      CFLAGS_x86_64_apple_darwin: "-O2 -fstrict-aliasing -flto=full -march=x86-64-v2 -mtune=generic"
      CFLAGS_aarch64_apple_darwin: "-O2 -fstrict-aliasing -flto=full -mcpu=apple-m1 -mtune=generic"
      RUSTFLAGS: "-C lto=fat -Z mir-opt-level=4 -Z virtual-function-elimination -Z threads=3 -D warnings"
      PATH: "${{ github.workspace }}/.venv/bin:/Users/runner/.local/bin:/Users/runner/.cargo/bin:/usr/local/opt/curl/bin:/usr/local/bin:/usr/local/sbin:/Users/runner/bin:/Library/Frameworks/Python.framework/Versions/Current/bin:/usr/bin:/bin:/usr/sbin:/sbin"
    steps:

    - uses: actions/checkout@v4

    - uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: "${{ matrix.python.version }}"
        cache-build: true
        allow-build: allow

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "nightly-2024-07-02"
        targets: "aarch64-apple-darwin, x86_64-apple-darwin"
        components: "rust-src"

    - name: Build environment
      run: |
        export PATH="/Users/runner/.local/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

        cargo fetch --target aarch64-apple-darwin &

        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="/Users/runner/.local/bin:$HOME/.local/bin:$PATH"
        uv venv --python python${{ matrix.python.version }}
        uv pip install --upgrade --index-url 'https://:2024-07-02@time-machines-pypi.sealsecurity.io/' "maturin==1.6.0" -r test/requirements.txt -r integration/requirements.txt

        mkdir .cargo
        cp ci/config.toml .cargo/config.toml

        # pin sysroot compiler_builtins to =0.1.105 (period-correct for nightly-2024-07-02, satisfies std's own floor): a caret drifts to >=0.1.160 which needs edition2024, and per-crate exact pins conflict on the compiler-rt links key
        # drift to a newer version that needs edition2024 (unparseable by this nightly)
        SYSROOT=$(rustc --print sysroot); find "$SYSROOT" -name Cargo.toml -exec grep -l compiler_builtins {} \; | while read f; do sed -i '' -E 's/(compiler_builtins[^"]*version = )"[0-9][0-9.]*"/\1"=0.1.105"/; s/(compiler_builtins = )"[0-9][0-9.]*"/\1"=0.1.105"/' "$f"; done

    - name: maturin
      run: |
        PATH=$HOME/.cargo/bin:$PATH \
        MACOSX_DEPLOYMENT_TARGET="${{ matrix.python.macosx_target }}" \
        PYO3_CROSS_LIB_DIR=$(python -c "import sysconfig;print(sysconfig.get_config_var('LIBDIR'))") \
        maturin build --release --strip \
          --features=no-panic,unstable-simd,yyjson \
          --interpreter python${{ matrix.python.version }} \
          --target=universal2-apple-darwin
        uv pip install target/wheels/orjson*.whl

    - run: pytest -s -rxX -v -n 3 test ${{ inputs.test-filter && format('-k ''{0}''', inputs.test-filter) || '' }}
      env:
        PYTHONMALLOC: "debug"

    - run: source .venv/bin/activate && ./integration/run thread
    - run: source .venv/bin/activate && ./integration/run http
    - run: source .venv/bin/activate && ./integration/run init

    - name: Store wheels
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_universal2_amd64_${{ matrix.python.version }}
        path: target/wheels
        overwrite: true
        retention-days: 1

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.13' },
          { version: '3.12' },
          { version: '3.11' },
          { version: '3.10' },
          { version: '3.9' },
          { version: '3.8' },
        ]
        platform:
          - arch: 'x64'
            target: 'x86_64-pc-windows-msvc'
          - arch: 'x86'
            target: 'i686-pc-windows-msvc'
    env:
      CFLAGS: "-Os -flto"
      LDFLAGS: "-Wl,--as-needed"
      RUSTFLAGS: "-C lto=fat -Z mir-opt-level=4 -Z virtual-function-elimination -D warnings"
    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "${{ matrix.python.version }}"
        architecture: "${{ matrix.platform.arch }}"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "nightly-2024-07-02"
        targets: "${{ matrix.platform.target }}"
        components: "rust-src"

    - name: build-std
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path .cargo | Out-Null
        Copy-Item ci/config.toml .cargo/config.toml -Force

    - name: compiler_builtins pin
      shell: pwsh
      run: |
        # pin sysroot compiler_builtins to =0.1.105 (period-correct for nightly-2024-07-02, satisfies std's own floor): a caret drifts to >=0.1.160 which needs edition2024, and per-crate exact pins conflict on the compiler-rt links key
        # drift to a newer version that needs edition2024 (unparseable by this nightly)
        $sysroot = (rustc --print sysroot)
        Get-ChildItem -Path $sysroot -Recurse -Filter Cargo.toml -ErrorAction SilentlyContinue | ForEach-Object {
          $body = Get-Content -Raw -LiteralPath $_.FullName
          if ($body -match 'compiler_builtins') {
            $pinned = $body -replace 'compiler_builtins = "[0-9][0-9.]*"', 'compiler_builtins = "=0.1.105"'
            $pinned = $pinned -replace '(compiler_builtins[^"\r\n]*version = )"[0-9][0-9.]*"', '$1"=0.1.105"'
            if ($pinned -ne $body) {
              Set-Content -NoNewline -LiteralPath $_.FullName -Value $pinned
              Write-Host "pinned compiler_builtins in $($_.FullName)"
            }
          }
        }

    - name: build dependencies
      # upstream cut cp313 (Windows-only in 3.10.6) after upgrading maturin, so the
      # released cp313 wheels carry `Generator: maturin (1.7.0)` while every other
      # artifact carries 1.6.0 - pin per interpreter to match each wheel's WHEEL metadata
      # maturin 1.7.0 postdates the 2024-07-02 snapshot, so the cp313 legs read a
      # 2024-08-01 one for this build dependency alone (test deps stay at 2024-07-02)
      run: python -m pip install --upgrade --index-url "https://:${{ matrix.python.version == '3.13' && '2024-08-01' || '2024-07-02' }}@time-machines-pypi.sealsecurity.io/" pip "maturin==${{ matrix.python.version == '3.13' && '1.7.0' || '1.6.0' }}" wheel

    - name: test dependencies
      run: python -m pip install --index-url "https://:2024-07-02@time-machines-pypi.sealsecurity.io/" -r test/requirements.txt -r integration/requirements.txt

    - name: build
      run: maturin build --release --strip --features=no-panic,unstable-simd,yyjson -i python --target ${{ matrix.platform.target }} --out dist

    - name: install
      run: python -m pip install orjson --no-index --find-links=dist --force-reinstall

    - name: pytest
      run: python -m pytest -s -rxX -v test ${{ inputs.test-filter && format('-k ''{0}''', inputs.test-filter) || '' }}
      env:
        PYTHONMALLOC: "debug"

    - name: thread
      run: python integration/thread

    - name: init
      run: python integration/init

    - name: Store wheels
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_windows_${{ matrix.platform.arch }}_${{ matrix.python.version }}
        path: dist
        if-no-files-found: error
        overwrite: true
        retention-days: 1

  pypi:
    name: PyPI
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: false
    needs: [
      sdist,
      manylinux_2_17_amd64,
      musllinux_1_2,
      manylinux_2_17_non_amd64,
      macos_universal2_aarch64,
      macos_universal2_amd64,
      windows,
    ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: orjson_*
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --index-url 'https://:2024-07-02@time-machines-pypi.sealsecurity.io/' pip "maturin==1.6.0"
      - run: ls -1 .
      - name: deploy wheel
        run: maturin upload --skip-existing --username "$MATURIN_USERNAME" *.whl
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      - name: deploy sdist
        run: maturin upload --skip-existing --username "$MATURIN_USERNAME" *.tar.gz
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
